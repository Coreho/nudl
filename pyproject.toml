[project]
name = "nudl"
version = "0.1.1"
description = "Strip tracking junk off any link you copy — the same real URL, trimmed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "pystray>=0.19",
    # tray.py imports PIL directly to draw the icon. pystray happens to pull Pillow in
    # today, so this works undeclared — right up until it doesn't.
    "Pillow>=9.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6"]

# Without these, `pip install nudl` installs a package with no way to start it.
# `nudlw` is the windowed entry point (no console window); `nudl` keeps a console,
# which is what you want when something is going wrong.
[project.scripts]
nudl = "src.app:main"

[project.gui-scripts]
nudlw = "src.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["rules.json"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]
addopts = "-q"
# The cleaning engine is pure Python and runs anywhere. The Win32 tests obviously do
# not, and they must SKIP off-Windows rather than blow up at collection — otherwise a
# contributor on Linux cannot run the suite that matters at all.
markers = [
    "windows: requires Win32 APIs",
    "integration: drives the REAL Windows clipboard (no fakes); will not run beside a live nudl",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
