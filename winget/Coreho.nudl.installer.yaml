# nudl ships as a PyInstaller --onedir tree (nudl.exe + nudlw.exe over an _internal
# folder of dependencies) inside a zip, not a single portable exe. "zip" + NestedInstallerType
# "portable" is the pattern winget-pkgs uses for that shape: the whole archive is
# extracted into the install dir, and only the named files are symlinked onto PATH, so
# both exes keep _internal beside them.
#
# From 0.2.0, `nudl` is the command line and `nudlw` is the tray app (the same split
# `pip install nudl` makes). Double-clicking nudl.exe still opens the tray.
PackageIdentifier: Coreho.nudl
PackageVersion: 0.2.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: nudl.exe
    PortableCommandAlias: nudl
  - RelativeFilePath: nudlw.exe
    PortableCommandAlias: nudlw
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Coreho/nudl/releases/download/v0.2.0/nudl-0.2.0-win64.zip
    InstallerSha256: 56589B118330514DB29583E47509AF8DA6668AC2DE040AA4E551B6A62A724E69
ManifestType: installer
ManifestVersion: 1.6.0
